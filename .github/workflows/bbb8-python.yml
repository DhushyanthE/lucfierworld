name: bbb8-python

on:
  push:
    paths:
      - 'quantum-core/**'
      - '.github/workflows/bbb8-python.yml'
  pull_request:
    paths:
      - 'quantum-core/**'
      - '.github/workflows/bbb8-python.yml'

jobs:
  verify-bbb8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: quantum-core/requirements-test-bbb8.txt
      - name: Install BBB8 test dependencies
        run: python -m pip install -r quantum-core/requirements-test-bbb8.txt
      - name: Dependency integrity
        run: python -m pip check
      - name: Syntax check
        working-directory: quantum-core
        run: |
          python -m py_compile \
            bbb8_models.py bbb8_quantum.py bbb8_decision.py bbb8_crypto.py \
            bbb8_consensus.py bbb8_service.py bbb8_routes.py bbb8_app.py \
            main.py bbb8_entangled_regression.py
      - name: BBB8 unit and integration tests
        working-directory: quantum-core
        run: |
          python -m pytest \
            test_bbb8.py \
            test_bbb8_gateways.py \
            test_bbb8_main.py \
            test_entangled_optimizer_regression.py \
            -q

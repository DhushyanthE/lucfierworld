name: deploy-leviathan-sepolia

on:
  workflow_dispatch:
    inputs:
      initial_supply_lvth:
        description: Initial LVTH supply
        required: true
        default: "1000000"
      initial_liquidity_eth:
        description: Initial ETH liquidity (optional)
        required: false
        default: "0.001"
      initial_liquidity_lvth:
        description: Initial LVTH liquidity (optional)
        required: false
        default: "1000"
      smoke_swap_eth:
        description: Tiny ETH smoke swap after seeding liquidity (optional)
        required: false
        default: "0.0001"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: sepolia
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --no-package-lock --no-audit --no-fund

      - name: Deploy LeviathanCoin to Sepolia
        env:
          EVM_RPC_URL: ${{ secrets.EVM_RPC_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          LVTH_INITIAL_SUPPLY: ${{ inputs.initial_supply_lvth }}
          LVTH_INITIAL_LIQUIDITY_ETH: ${{ inputs.initial_liquidity_eth }}
          LVTH_INITIAL_LIQUIDITY_LVTH: ${{ inputs.initial_liquidity_lvth }}
          LVTH_SMOKE_SWAP_ETH: ${{ inputs.smoke_swap_eth }}
        run: |
          test -n "$EVM_RPC_URL" || { echo "::error::EVM_RPC_URL secret missing"; exit 1; }
          test -n "$DEPLOYER_PRIVATE_KEY" || { echo "::error::DEPLOYER_PRIVATE_KEY secret missing"; exit 1; }
          npm run deploy:leviathan:sepolia

      - name: Prepare deployment outputs
        id: deployment
        run: |
          node -e "const x=require('./artifacts/leviathan-sepolia.json'); console.log('contract='+x.contract); console.log('deployer='+x.deployer)" >> "$GITHUB_OUTPUT"

      - name: Check Supabase deployment credentials
        id: supabase_gate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Contract deployed; backend auto-wiring skipped because Supabase deploy credentials are absent."
          fi

      - name: Setup Supabase CLI
        if: steps.supabase_gate.outputs.available == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Wire deployed address into Supabase backend
        if: steps.supabase_gate.outputs.available == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          EVM_RPC_URL: ${{ secrets.EVM_RPC_URL }}
          LEVIATHAN_CONTRACT_ADDRESS: ${{ steps.deployment.outputs.contract }}
          LEVIATHAN_DEPLOYER_ADDRESS: ${{ steps.deployment.outputs.deployer }}
        run: |
          supabase secrets set \
            EVM_RPC_URL="$EVM_RPC_URL" \
            LEVIATHAN_CONTRACT_ADDRESS="$LEVIATHAN_CONTRACT_ADDRESS" \
            LEVIATHAN_DEPLOYER_ADDRESS="$LEVIATHAN_DEPLOYER_ADDRESS" \
            --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy leviathan-chain --project-ref "$SUPABASE_PROJECT_REF"

      - uses: actions/upload-artifact@v4
        with:
          name: leviathan-sepolia-deployment
          path: artifacts/leviathan-sepolia.json

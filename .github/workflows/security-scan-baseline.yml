name: Security Scan Regression
on:
  schedule:
    - cron: "0 6 * * *"      # nightly 06:00 UTC
  workflow_dispatch:           # on-demand
  pull_request:
    paths:
      - "security-baseline/**"
      - "scripts/compare-findings.js"
      - ".github/workflows/security-scan-baseline.yml"

permissions:
  contents: write              # required to push the updated baseline on main
  pull-requests: write

jobs:
  scan-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      new_high_critical: ${{ steps.compare.outputs.new_high_critical }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Load baseline
        run: |
          mkdir -p security-baseline
          if [ -f security-baseline/findings.json ]; then
            cp security-baseline/findings.json baseline.json
          else
            echo '[]' > baseline.json
          fi

      - name: npm audit (HIGH/CRITICAL only) → findings JSON
        run: |
          npm audit --json --audit-level=high > npm-audit.json || true
          node -e "
            const fs = require('fs');
            const raw = JSON.parse(fs.readFileSync('npm-audit.json','utf8') || '{}');
            const sev = s => s==='critical'?'CRITICAL':s==='high'?'HIGH':s==='moderate'?'MEDIUM':'LOW';
            const out = [];
            for (const [name, v] of Object.entries(raw.vulnerabilities ?? {})) {
              out.push({
                id: 'npm:' + name + ':' + (v.via?.[0]?.source ?? v.range ?? 'unknown'),
                scanner: 'npm-audit',
                rule: (typeof v.via?.[0] === 'object' ? v.via[0].title : name) || name,
                severity: sev(v.severity),
                status: 'OPEN',
                resource: name + '@' + (v.range || '*'),
                owner: 'platform-team',
                fix_commit: null,
                detected_at: new Date().toISOString(),
              });
            }
            fs.writeFileSync('npm-findings.json', JSON.stringify(out, null, 2));
          "

      - name: Merge scanner outputs into new-findings.json
        run: |
          # Append Wiz / Trivy / other JSON exports here as additional inputs.
          node -e "
            const fs = require('fs');
            const all = [];
            for (const p of ['npm-findings.json']) {
              if (fs.existsSync(p)) all.push(...JSON.parse(fs.readFileSync(p,'utf8')));
            }
            fs.writeFileSync('new-findings.json', JSON.stringify(all, null, 2));
            console.log('Total findings:', all.length);
          "

      - name: Publish findings to /security so the dashboard can read them
        run: |
          mkdir -p public/security
          cp new-findings.json public/security/findings.json

      - name: Compare with baseline
        id: compare
        run: node scripts/compare-findings.js baseline.json new-findings.json

      - name: Summarize regressions
        if: failure()
        run: |
          echo "## ❌ New HIGH/CRITICAL findings vs. baseline" >> $GITHUB_STEP_SUMMARY
          jq . new-findings.json >> $GITHUB_STEP_SUMMARY

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-findings
          path: |
            new-findings.json
            baseline.json
          retention-days: 30

      - name: Update baseline (scheduled main runs only)
        if: success() && github.event_name == 'schedule' && github.ref == 'refs/heads/main'
        run: |
          cp new-findings.json security-baseline/findings.json
          if ! git diff --quiet security-baseline/; then
            git config user.name  "security-bot"
            git config user.email "security-bot@users.noreply.github.com"
            git add security-baseline/findings.json public/security/findings.json
            git commit -m "chore(security): refresh baseline ($(date -u +%FT%TZ))"
            git push
          fi

  security-gate:
    runs-on: ubuntu-latest
    needs: scan-compare
    if: needs.scan-compare.outputs.new_high_critical != '0'
    # GitHub Environments enforce required reviewers — configure the
    # `security-approval` environment with your security team to gate merges
    # behind an explicit human approval after each fix.
    environment: security-approval
    steps:
      - name: Await manual security approval
        run: |
          echo "Blocked: ${{ needs.scan-compare.outputs.new_high_critical }} new HIGH/CRITICAL finding(s)."
          echo "A reviewer in the 'security-approval' environment must approve to proceed."
          exit 1

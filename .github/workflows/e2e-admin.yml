name: admin-e2e

on:
  push:
    branches: [main]
    paths:
      - "src/pages/admin/**"
      - "supabase/functions/stripe-replay-audit-export/**"
      - "supabase/functions/stripe-webhook-replay/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "public/openapi/**"
      - "scripts/validate-openapi.mjs"
      - ".github/workflows/e2e-admin.yml"
  pull_request:
    paths:
      - "src/pages/admin/**"
      - "supabase/functions/stripe-replay-audit-export/**"
      - "supabase/functions/stripe-webhook-replay/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "public/openapi/**"
      - "scripts/validate-openapi.mjs"
  workflow_dispatch:

jobs:
  # Fast structural gate: fail the build before spinning up browsers if the
  # OpenAPI contract has regressed.
  openapi-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate public/openapi/admin.json against OpenAPI 3.1
        run: node scripts/validate-openapi.mjs

  admin-ui:
    runs-on: ubuntu-latest
    needs: openapi-schema
    timeout-minutes: 25
    env:
      CI: "true"
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Guard against missing E2E secrets
        run: |
          if [ -z "$E2E_BASE_URL" ] || [ -z "$E2E_ADMIN_EMAIL" ] || [ -z "$E2E_ADMIN_PASSWORD" ]; then
            echo "::error::E2E_BASE_URL / E2E_ADMIN_EMAIL / E2E_ADMIN_PASSWORD must be configured as repository secrets."
            exit 1
          fi
      # Deterministic readiness gate: poll the target URL until it responds with 2xx/3xx
      # so the suite never starts against a half-warm preview environment.
      - name: Wait for E2E target to be reachable
        run: |
          echo "Waiting for $E2E_BASE_URL..."
          for i in $(seq 1 60); do
            code=$(curl -ksS -o /dev/null -w "%{http_code}" "$E2E_BASE_URL" || echo "000")
            if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
              echo "Ready (HTTP $code) after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::$E2E_BASE_URL did not become reachable within 120s"
          exit 1
      - name: Run Playwright admin suite (retries=2, workers=1 on CI)
        run: npx playwright test --reporter=list,html
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
      - name: Upload Playwright traces / videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: test-results
          retention-days: 14

name: admin-e2e

on:
  push:
    branches: [main]
    paths:
      - "src/pages/admin/**"
      - "supabase/functions/stripe-replay-audit-export/**"
      - "supabase/functions/stripe-webhook-replay/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - ".github/workflows/e2e-admin.yml"
  pull_request:
    paths:
      - "src/pages/admin/**"
      - "supabase/functions/stripe-replay-audit-export/**"
      - "supabase/functions/stripe-webhook-replay/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
  workflow_dispatch:

jobs:
  admin-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Guard against missing E2E secrets
        run: |
          if [ -z "$E2E_BASE_URL" ] || [ -z "$E2E_ADMIN_EMAIL" ] || [ -z "$E2E_ADMIN_PASSWORD" ]; then
            echo "::error::E2E_BASE_URL / E2E_ADMIN_EMAIL / E2E_ADMIN_PASSWORD must be configured as repository secrets."
            exit 1
          fi
      - name: Run Playwright admin suite (fails the build on any regression)
        run: npx playwright test
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
